{"name": "Build APK", "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Unpack project", "run": "unzip -q DropChat.zip"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}}, {"name": "Build debug APK", "working-directory": "DropChat", "run": "gradle assembleDebug --no-daemon"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "DropChat-debug-apk", "path": "DropChat/app/build/outputs/apk/debug/app-debug.apk"}}]}}, "on": ["push", "workflow_dispatch"]}
